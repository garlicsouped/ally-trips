<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ally Trips - Shared Trip</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Identity gate shown before any trip content, restricted to pre-approved companion names only -->
<div class="identity-gate" id="identityGate">
  <div class="identity-box">
    <h2 id="identityTripName">WHO ARE YOU?</h2>
    <p style="font-size:13px;color:var(--ink-soft);">Pick your name to continue. Only people already added to this trip can make edits.</p>
    <div class="identity-list" id="identityList"></div>
  </div>
</div>

<div class="topbar">
  <div>
    <h1 class="pixel-font">ALLY TRIPS</h1>
    <div class="subtitle" id="tripSubtitle">Shared trip</div>
  </div>
</div>

<div class="container">
  <div class="trip-hero" id="tripHero">
    <!-- injected -->
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="itinerary">ITINERARY</button>
    <button class="tab-btn" data-tab="flights">FLIGHTS</button>
    <button class="tab-btn" data-tab="companions">COMPANIONS</button>
    <button class="tab-btn" data-tab="files">FILES</button>
  </div>

  <div class="tab-panel active" id="panel-itinerary">
    <div id="dayList"></div>
  </div>

  <div class="tab-panel" id="panel-flights">
    <div id="flightList"></div>
    <button class="add-flight-btn" id="addFlightBtn">+ ADD FLIGHT</button>
  </div>

  <div class="tab-panel" id="panel-companions">
    <div id="companionList"></div>
  </div>

  <div class="tab-panel" id="panel-files">
    <div id="fileList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="itemModal">
  <div class="modal-box">
    <h3>ADD ITINERARY ITEM</h3>
    <label>Time</label>
    <input type="time" id="itemTime">
    <label>Title</label>
    <input type="text" id="itemTitle" placeholder="What are you doing?">
    <label>Location</label>
    <input type="text" id="itemLocation" placeholder="Where?">
    <label>Notes</label>
    <textarea id="itemNotes" rows="2" placeholder="Any notes or links"></textarea>
    <label>Flexibility</label>
    <select id="itemFlex">
      <option value="must">Must do</option>
      <option value="nice">Nice to have</option>
    </select>
    <label>Attach a Photo (ticket, hotel confirmation, screenshot, etc)</label>
    <input type="file" id="itemPhotoInput" accept="image/*">
    <div id="itemPhotoPreview"></div>
    <label>Add a Link (TikTok links will show as a playable video)</label>
    <input type="text" id="itemLinkInput" placeholder="Paste a TikTok link or any URL">
    <div class="modal-actions">
      <button class="btn" id="cancelItemBtn">CANCEL</button>
      <button class="btn primary" id="saveItemBtn">SAVE</button>
    </div>
  </div>
</div>

<div class="lightbox-overlay" id="lightboxOverlay">
  <img id="lightboxImg" src="" alt="enlarged photo">
</div>

<div class="modal-overlay" id="flightModal">
  <div class="modal-box">
    <h3>ADD FLIGHT</h3>
    <label>Airline</label>
    <input type="text" id="flightAirline" placeholder="e.g. ANA">
    <label>Flight Number</label>
    <input type="text" id="flightNumber" placeholder="e.g. NH 847">
    <label>From</label>
    <input type="text" id="flightFrom" placeholder="e.g. SIN">
    <label>To</label>
    <input type="text" id="flightTo" placeholder="e.g. KIX">
    <label>Departure Date and Time</label>
    <input type="datetime-local" id="flightDepart">
    <label>Arrival Date and Time</label>
    <input type="datetime-local" id="flightArrive">
    <label>Confirmation Code</label>
    <input type="text" id="flightConfirmation" placeholder="e.g. ZQ7F2A">
    <label>Attach a Photo (boarding pass, e-ticket, screenshot, etc)</label>
    <input type="file" id="flightPhotoInput" accept="image/*">
    <div id="flightPhotoPreview"></div>
    <div class="modal-actions">
      <button class="btn" id="cancelFlightBtn">CANCEL</button>
      <button class="btn primary" id="saveFlightBtn">SAVE</button>
    </div>
  </div>
</div>

<!-- Add Day Modal -->
<div class="modal-overlay" id="dayModal">
  <div class="modal-box">
    <h3>ADD DAY TO ITINERARY</h3>
    <label>Date</label>
    <input type="date" id="dayDateInput">
    <label>Expected Weather (placeholder until live forecast is connected)</label>
    <select id="dayWeatherIcon">
      <option value="sun">Sunny</option>
      <option value="cloud">Cloudy</option>
      <option value="rain">Rainy</option>
    </select>
    <div class="modal-actions">
      <button class="btn" id="cancelDayBtn">CANCEL</button>
      <button class="btn primary" id="saveDayBtn">ADD DAY</button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/sound.js"></script>
<script src="js/share.js"></script>
</body>
</html>
