<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ally Trips - Dashboard</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <div>
    <h1 class="pixel-font">ALLY TRIPS</h1>
    <div class="subtitle">Plan every adventure, one pixel at a time</div>
  </div>
  <div class="topbar-nav">
    <a href="index.html" class="active">HOME</a>
    <a href="archive.html">ARCHIVE</a>
    <a href="settings.html">SETTINGS</a>
  </div>
</div>

<div class="container">
  <div class="section-title pixel-font">
    <img src="assets/icons/pin.png" class="icon-sm" alt="pin">
    YOUR TRIPS
  </div>

  <div class="trip-grid" id="tripGrid">
    <!-- Trip cards injected by js/dashboard.js -->
  </div>
</div>

<img src="assets/sprites/walk_frame_1.png" class="mascot" id="mascotImg" alt="traveler mascot">

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="newTripModal">
  <div class="modal-box">
    <h3>ADD NEW TRIP</h3>
    <label>Trip Name</label>
    <input type="text" id="newTripName" placeholder="e.g. Tokyo Spring Trip">
    <label>Destination</label>
    <input type="text" id="newTripDestination" placeholder="e.g. Tokyo, Japan">
    <label>Start Date</label>
    <input type="date" id="newTripStart">
    <label>End Date</label>
    <input type="date" id="newTripEnd">
    <label>Cover Emoji</label>
    <input type="text" id="newTripEmoji" placeholder="e.g. 🗼" maxlength="4">
    <div class="modal-actions">
      <button class="btn" id="cancelNewTripBtn">CANCEL</button>
      <button class="btn primary" id="saveNewTripBtn">CREATE TRIP</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/access-gate.js"></script>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/sound.js"></script>
<script src="js/spotify-config.js"></script>
<script src="js/spotify-auth.js"></script>
<script src="js/spotify-player.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
